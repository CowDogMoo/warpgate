---
name: Pre-Commit
on:
  merge_group:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  schedule:
    # Run once a week (see https://crontab.guru)
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  go-ci:
    name: Pre-commit
    uses: CowDogMoo/renovate-config/.github/workflows/go-ci.yaml@833f09892169458ef84329952e6634b1611de3e4 # main
    permissions:
      contents: read
    with:
      tests: false
      apt-packages: build-essential btrfs-progs libgpgme-dev libbtrfs-dev pkg-config
      go-installs: github.com/goreleaser/goreleaser/v2@latest
